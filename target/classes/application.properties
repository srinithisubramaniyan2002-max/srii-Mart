# ====================================================================
# Srinidhi Mart - Application Properties
# ====================================================================
spring.application.name=srinidhi-mart
server.port=8080

# Active profile: Change to 'mysql' to use MySQL, or 'h2' for instant testing without MySQL
# Default is 'mysql' as per project requirements
spring.profiles.active=mysql

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Static Frontend Resources (serves HTML/CSS/JS directly on http://localhost:8080)
spring.web.resources.static-locations=classpath:/static/
